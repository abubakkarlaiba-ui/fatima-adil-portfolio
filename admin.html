<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fatima Adil</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0B1220;
            --bg-secondary: #0F1728;
            --bg-card: #111B2E;
            --text-ivory: #F4F0E6;
            --text-muted: #9AA6B8;
            --gold: #C9A227;
            --border-subtle: rgba(201, 162, 39, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-ivory);
            min-height: 100vh;
        }

        /* LOGIN SCREEN */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-ivory);
            margin-bottom: 0.5rem;
        }

        .login-logo .dot {
            color: var(--gold);
        }

        .login-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .login-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-ivory);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 1rem;
            transition: border-color 0.3s;
        }

        .login-input:focus {
            border-color: var(--gold);
        }

        .login-input::placeholder {
            color: rgba(154, 166, 184, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--gold);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: var(--text-ivory);
        }

        .login-error {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 0.8rem;
            display: none;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
        }

        .dash-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1.5rem 3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dash-header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .dash-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-ivory);
            text-decoration: none;
        }

        .dash-logo .dot {
            color: var(--gold);
        }

        .dash-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .dash-header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .msg-count-badge {
            background: var(--gold);
            color: var(--bg-primary);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid rgba(244, 240, 230, 0.2);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .dash-body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem;
        }

        .dash-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gold);
        }

        .messages-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2rem;
        }

        .messages-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .messages-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 600;
            font-style: italic;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--gold);
            border-radius: 8px;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-name {
            font-weight: 600;
            color: var(--text-ivory);
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }

        .msg-email {
            font-size: 0.8rem;
            color: var(--gold);
            margin-bottom: 0.8rem;
        }

        .msg-project {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .msg-text {
            font-size: 0.9rem;
            color: var(--text-ivory);
            line-height: 1.6;
            opacity: 0.9;
        }

        .msg-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.8rem;
            opacity: 0.7;
        }

        .msg-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-end;
            justify-content: space-between;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: rgba(231, 76, 60, 0.1);
            border-color: #e74c3c;
        }

        .reply-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--gold);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .reply-btn:hover {
            border-color: var(--gold);
            background: rgba(201, 162, 39, 0.1);
        }

        .no-messages {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .no-messages i {
            font-size: 3rem;
            color: var(--border-subtle);
            margin-bottom: 1rem;
        }

        .no-messages p {
            font-size: 1rem;
        }

        .empty-dot {
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 768px) {
            .dash-header {
                padding: 1rem 1.5rem;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .dash-body {
                padding: 1.5rem;
            }

            .dash-stats {
                grid-template-columns: 1fr;
            }

            .message-item {
                grid-template-columns: 1fr;
            }

            .msg-actions {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-logo">F<span class="dot">·</span>A</div>
            <div class="login-subtitle">Admin Dashboard</div>
            <input type="password" class="login-input" id="passwordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()">
            <button class="login-btn" onclick="login()">ACCESS DASHBOARD</button>
            <div class="login-error" id="loginError">Incorrect password. Try again.</div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
        <header class="dash-header">
            <div class="dash-header-left">
                <a href="index.html" class="dash-logo">F<span class="dot">·</span>A</a>
                <span class="dash-title">Admin Dashboard</span>
            </div>
            <div class="dash-header-right">
                <span class="msg-count-badge" id="msgCount">0 Messages</span>
                <button class="logout-btn" onclick="logout()">LOGOUT</button>
            </div>
        </header>

        <div class="dash-body">
            <div class="dash-stats">
                <div class="stat-card">
                    <div class="stat-label">Total Messages</div>
                    <div class="stat-value" id="totalMsg">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Today</div>
                    <div class="stat-value" id="todayMsg">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" style="font-size:1.5rem"><span class="empty-dot"></span>Live</div>
                </div>
            </div>

            <div class="messages-section">
                <div class="messages-header">
                    <span class="messages-title">Incoming Messages</span>
                    <button class="refresh-btn" onclick="loadMessages()"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div class="message-list" id="messageList">
                    <div class="no-messages">
                        <i class="fas fa-inbox"></i>
                        <p>No messages yet</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        var ADMIN_PASSWORD = 'fatima2026';

        function login() {
            var pw = document.getElementById('passwordInput').value;
            if (pw === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadMessages();
            } else {
                document.getElementById('loginError').style.display = 'block';
                setTimeout(function() {
                    document.getElementById('loginError').style.display = 'none';
                }, 3000);
            }
        }

        function logout() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
        }

        function loadMessages() {
            db.ref('messages').orderByChild('timestamp').on('value', function(snapshot) {
                var list = document.getElementById('messageList');
                var messages = [];
                var todayCount = 0;
                var today = new Date().toDateString();

                snapshot.forEach(function(child) {
                    var msg = child.val();
                    msg.id = child.key;
                    messages.unshift(msg);

                    if (new Date(msg.timestamp).toDateString() === today) {
                        todayCount++;
                    }
                });

                document.getElementById('totalMsg').textContent = messages.length;
                document.getElementById('todayMsg').textContent = todayCount;
                document.getElementById('msgCount').textContent = messages.length + ' Messages';

                if (messages.length === 0) {
                    list.innerHTML = '<div class="no-messages"><i class="fas fa-inbox"></i><p>No messages yet</p></div>';
                    return;
                }

                list.innerHTML = '';
                messages.forEach(function(msg) {
                    var time = new Date(msg.timestamp);
                    var timeStr = time.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' at ' + time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                    var item = document.createElement('div');
                    item.className = 'message-item';
                    item.innerHTML =
                        '<div class="msg-content">' +
                            '<div class="msg-name"><i class="fas fa-user" style="color:var(--gold);margin-right:0.5rem;font-size:0.8rem;"></i>' + escapeHtml(msg.name || 'Anonymous') + '</div>' +
                            '<div class="msg-email"><i class="fas fa-envelope" style="margin-right:0.4rem;"></i>' + escapeHtml(msg.email || 'No email') + '</div>' +
                            (msg.project ? '<div class="msg-project"><strong>Project:</strong> ' + escapeHtml(msg.project) + '</div>' : '') +
                            (msg.message ? '<div class="msg-text">' + escapeHtml(msg.message) + '</div>' : '') +
                            '<div class="msg-time"><i class="fas fa-clock" style="margin-right:0.3rem;"></i>' + timeStr + '</div>' +
                        '</div>' +
                        '<div class="msg-actions">' +
                            '<a href="https://mail.google.com/mail/?view=cm&fs=1&to=' + (msg.email || '') + '&subject=Re: Portfolio Inquiry" target="_blank" class="reply-btn"><i class="fas fa-reply"></i> Reply</a>' +
                            '<button class="delete-btn" onclick="deleteMsg(\'' + msg.id + '\')"><i class="fas fa-trash"></i> Delete</button>' +
                        '</div>';
                    list.appendChild(item);
                });
            });
        }

        function deleteMsg(id) {
            if (confirm('Delete this message?')) {
                db.ref('messages/' + id).remove();
            }
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('passwordInput').focus();
    </script>
</body>
</html>
